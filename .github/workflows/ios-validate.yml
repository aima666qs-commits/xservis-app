name: iOS Native Validation

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'Makefile'
      - '.github/workflows/ios-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'Makefile'
      - '.github/workflows/ios-validate.yml'

concurrency:
  group: ios-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Prepare iOS dependencies
        env:
          CHANNEL: dev
        run: |
          set -euo pipefail
          make ios-prepare

      - name: Build iOS simulator without signing
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug --no-codesign
